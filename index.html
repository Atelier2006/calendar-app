<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>いつめん用カレンダー</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/ja.global.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/rrule@2.7.2/dist/es5/rrule.min.js" defer></script>



    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js" defer></script>

    <link rel="stylesheet" href="style.css">

    <!-- 初回表示までの読み込み画面（style.css読み込み前でも即表示できるよう インラインで定義） -->
    <style>
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: radial-gradient(circle at top, #141834, #0b0e1a);
            color: #eef1ff;
            font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
            z-index: 999999;
            transition: opacity 0.25s ease;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loadingOverlay .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00eaff;
            border-radius: 50%;
            animation: loading-spin 0.8s linear infinite;
        }

        #loadingOverlay .loading-text {
            font-size: 0.95em;
            color: #aab2d8;
        }

        @keyframes loading-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- 読み込み中オーバーレイ -->
    <div id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">読み込み中...</div>
    </div>

    <!-- ユーザー名選択モーダル -->
    <div id="userPickerModal" class="modal hidden">
        <div class="modal-inner" style="max-width:520px;">
            <h2 style="margin:0 0 10px;">ユーザー名を選択</h2>

            <div class="muted" style="margin-bottom:10px;">
                既存の名前を選ぶか、無ければ新しく登録してね（パスワード不要）
            </div>

            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <input id="u_search" type="text" placeholder="検索（例：AsuYui）" style="flex:1;">
                <button id="u_reload" class="btn">更新</button>
            </div>

            <div id="u_list" class="user-list"></div>

            <hr style="opacity:.2; margin:14px 0;">

            <div style="display:flex; gap:8px; align-items:center;">
                <input id="u_new" type="text" placeholder="新しいユーザー名を登録" style="flex:1;">
                <button id="u_add" class="btn primary">登録</button>
            </div>

            <div class="muted" style="margin-top:10px;">
                ※同じ名前が既にある場合は登録できません
            </div>
        </div>
    </div>


    <header class="topbar">
        <h1>VRC個人用イベントカレンダー</h1>
        <button id="openSettings" class="btn">⚙ 設定</button>
    </header>

    <!-- タグフィルター -->
    <div id="tagFilter" class="tag-palette filter-panel"></div>

    <!-- 近日の予定パネル -->
    <div id="upcomingPanel" class="upcoming-panel">
        <div class="upcoming-header">
            <h2 class="upcoming-title">近日の予定</h2>
            <button id="upcomingToggle" class="btn small">隠す</button>
        </div>
        <div id="upcomingList" class="upcoming-list"></div>
    </div>

    <div id="calendar"></div>

    <!-- 日別予定一覧モーダル -->
    <div id="dayModal" class="modal hidden">
        <div class="modal-card">
            <h2 id="dayTitle">予定一覧</h2>

            <div class="actions" style="margin-top: 8px;">
                <button id="dayClose" class="btn">閉じる</button>
                <button id="dayAdd" class="btn primary">＋この日に追加</button>
            </div>

            <div id="dayList" class="day-list"></div>
        </div>
    </div>


    <!-- 予定編集モーダル -->
    <div id="eventModal" class="modal hidden">
        <div class="modal-card">
            <h2 id="modalTitle">予定</h2>

            <label>タイトル
                <input id="f_title" type="text" />
            </label>

            <div class="row">
                <label>開始
                    <input id="f_start" type="datetime-local" step="300">
                </label>
                <label>終了（任意）
                    <input id="f_end" type="datetime-local" step="300">
                </label>
            </div>

            <div class="duration-quick" id="durationQuick">
                <span class="muted">所要時間:</span>
                <button type="button" class="btn small" data-min="30">30分</button>
                <button type="button" class="btn small" data-min="60">1時間</button>
                <button type="button" class="btn small" data-min="120">2時間</button>
                <button type="button" class="btn small" data-min="180">3時間</button>
            </div>

            <label>
                繰り返し
                <select id="f_repeatType">
                    <option value="none">なし</option>
                    <option value="weekly">毎週</option>
                    <option value="bimonthly">隔月</option>
                    <option value="nthWeekdayMonthly">毎月 第◯曜日</option>
                </select>
            </label>

            <div class="row" id="repeatOptionsRow" style="display:none;">
                <div id="nthBox" class="nth-box">
                    <span class="nth-label">第</span>
                    <label><input type="checkbox" class="nth" value="1">1</label>
                    <label><input type="checkbox" class="nth" value="2">2</label>
                    <label><input type="checkbox" class="nth" value="3">3</label>
                    <label><input type="checkbox" class="nth" value="4">4</label>
                    <label><input type="checkbox" class="nth" value="-1">最終</label>
                </div>
            </div>

            <div id="repeatNote" class="muted" style="display:none; margin-top:4px;">
                ※この回だけの編集では、繰り返し設定はここでは変更できません（シリーズ全体を編集するには一旦削除して作り直してください）
            </div>


            <label>XのURL（任意）
                <input id="f_xurl" type="url" placeholder="https://x.com/..." />
            </label>

            <label class="row">
                <span>VRCグループ</span>
                <input id="f_vrcgroup" type="url"
                    placeholder="https://vrc.group/xxxx.xxxx / https://vrchat.com/home/group/grp_..." />
            </label>

            <label>タグ（カンマ区切り）
                <input id="f_tags" type="text" placeholder="ライブ,告知" />
            </label>

            <div class="tag-palette" id="tagPalette"></div>

            <label>メモ（任意）
                <textarea id="f_memo" rows="4"></textarea>
            </label>

            <p class="muted">追加者: <span id="f_creator"></span></p>

            <div class="actions">
                <button id="btnClose" class="btn">閉じる</button>
                <div class="right">
                    <button id="btnDelete" class="btn danger">削除</button>
                    <button id="btnSave" class="btn primary">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-card">
            <h2>設定</h2>

            <label>あなたの表示名（追加者として保存されます）
                <input id="s_name" type="text" placeholder="例）アスユイ" />
            </label>

            <div class="row">
                <label>週の開始
                    <select id="s_weekStart">
                        <option value="0">日曜始まり</option>
                        <option value="1">月曜始まり</option>

                    </select>
                </label>

                <label>初期表示
                    <select id="s_initialView">
                        <option value="dayGridMonth">月</option>
                        <option value="timeGridWeek">週</option>
                        <option value="timeGridDay">日</option>
                        <option value="listWeek">リスト（週）</option>
                    </select>
                </label>
            </div>

            <label>タグ候補（カンマ区切り・任意）
                <input id="s_tagPresets" type="text" placeholder="ライブ,告知,作業,集会" />
            </label>

            <label class="row" style="align-items:center;">
                <input id="s_notifyEnabled" type="checkbox" style="width:auto; margin:0 8px 0 0;">
                <span>イベント開始前に通知する</span>
            </label>

            <label>通知タイミング
                <select id="s_notifyMinutes">
                    <option value="10">10分前</option>
                    <option value="30">30分前</option>
                    <option value="60">60分前</option>
                </select>
            </label>

            <div class="actions">
                <button id="btnSettingsClose" class="btn">閉じる</button>
                <button id="btnSettingsSave" class="btn primary">保存</button>
            </div>

            <p class="muted">
                ※設定はこのブラウザに保存（localStorage）されます。<br>
                みんな共通の設定にしたい場合は、あとでFirestore側に「settings」ドキュメントを作る方式に拡張できます。
            </p>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>


</html>
